name: Dependabot

version: 2

updates:
  # Gradle, Android Gradle Plugin, Kotlin, AndroidX, Compose.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
    commit-message:
      prefix: 'build'
    groups:
      android-gradle-plugin:
        patterns:
          - 'com.android.*'
          - 'androidx.*'
      kotlin:
        patterns:
          - 'org.jetbrains.kotlin*'

  # GitHub Actions used by the CI workflows themselves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns:
          - '*'