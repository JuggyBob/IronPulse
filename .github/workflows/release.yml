name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release from'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version name from the tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build the release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          # From repository secrets. Never in the repository itself.
          IRONPULSE_KEYSTORE: ${{ secrets.IRONPULSE_KEYSTORE_BASE64 }}
          IRONPULSE_KEY_ALIAS: ${{ secrets.IRONPULSE_KEY_ALIAS }}
          IRONPULSE_KEY_PASSWORD: ${{ secrets.IRONPULSE_KEY_PASSWORD }}

      - name: Name the APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          mv "$APK" "IronPulse-${{ steps.version.outputs.name }}.apk"
          echo "APK_NAME=IronPulse-${{ steps.version.outputs.name }}.apk" >> "$GITHUB_ENV"

      - name: Generate checksums
        run: |
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: IronPulse ${{ steps.version.outputs.name }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, 'beta') }}
          body_path: CHANGELOG.md
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256

  verify:
    name: Verify the release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify the published APK is downloadable and matches its checksum
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          NAME="IronPulse-$TAG.apk"
          curl -fsSL "$BASE/$NAME.sha256" -o checksum.txt
          curl -fsSL "$BASE/$NAME" -o app.apk
          sha256sum --check checksum.txt
          echo "Release asset verified."