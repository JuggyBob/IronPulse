name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        # The executable bit on gradlew is recorded in git, not in the filesystem. Without it a
        # checkout on Linux lands a non-executable script and the build dies with "Permission
        # denied" before Gradle ever starts.
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IronPulse-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        with:
          # Full history. A secret removed in the latest commit is still in the object store, and
          # still a leak, so scanning only the tip would miss exactly the case worth catching.
          fetch-depth: 0

      - name: Fail if a secret was committed
        # Deliberately not a third-party scanning action.
        #
        # The hosted scanners either need a licence key on an organisation repository or send a
        # report off-platform. This is a small project with one secret-shaped risk (a Gemini API
        # key, entered at runtime and never committed), so the patterns are checked here directly.
        # That keeps the job dependency-free and auditable.
        run: |
          set -uo pipefail

          # Patterns are deliberately narrow: a Gemini key, a GitHub token, a private key block,
          # and a generic assignment of something that looks like a credential.
          PATTERNS='AIza[0-9A-Za-z_-]{35}|gh[pousr]_[0-9A-Za-z]{36,255}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[0-9A-Za-z-]{10,}|(api[_-]?key|secret|password|passwd|token)[ ]*[:=][ ]*["'"'"']?[A-Za-z0-9_/+=-]{16,}'

          # Skip the allowlist entries by path and by line, so a pattern in the workflow that
          # documents it does not report itself.
          ALLOW_PATHS='^\.github/workflows/ci\.yml$|^CONTRIBUTING\.md$|^\.env\.example$'

          FAILED=0
          while IFS= read -r hit; do
            path_in=$(printf '%s' "$hit" | cut -d: -f1)
            if printf '%s' "$path_in" | grep -Eq "$ALLOW_PATHS"; then
              continue
            fi
            printf '::error file=%s::Possible secret committed: %s\n' \
              "$path_in" "$(printf '%s' "$hit" | cut -d: -f2- | cut -c1-60)"
            FAILED=1
          done < <(git grep -nI -E "$PATTERNS" --all-match -- . ':!.github/workflows/ci.yml' || true)

          if [ "$FAILED" -ne 0 ]; then
            echo "A credential-shaped string is in the history. Remove it and rotate the key."
            exit 1
          fi

          # Also refuse the files that must never be tracked at all, whatever they contain.
          for forbidden in .env local.properties '*.jks' '*.keystore' '*.p12'; do
            if git ls-files --error-unmatch "$forbidden" >/dev/null 2>&1; then
              echo "::error::$forbidden is tracked. It must never be committed."
              exit 1
            fi
          done

          echo "No secrets found."
