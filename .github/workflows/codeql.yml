name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, at 03:17 UTC. Dependabot publishes new CodeQL queries on a fixed cadence, and a
    # query added after the last push would otherwise not be run for months.
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: kotlin
          queries: security-and-quality

      # Explicit build steps rather than `autobuild`.
      #
      # Autobuild for a Gradle project runs `./gradlew assemble`, which includes
      # `assembleRelease` — and configuring :app:packageRelease fails without the release signing
      # secrets, which a pull request from a fork never has. The analysis then dies on a build
      # error rather than reporting anything.
      #
      # Only the debug variant is needed: it compiles exactly the same source that CodeQL
      # analyses, and it needs no secrets.
      - name: Build (debug only)
        run: ./gradlew assembleDebug --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:kotlin'