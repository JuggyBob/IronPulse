name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, at 03:17 UTC. Dependabot publishes new CodeQL queries on a fixed cadence, and a
    # query added after the last push would otherwise not be run for months.
    - cron: '17 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: kotlin
          queries: security-and-quality

      # Explicit build steps rather than `autobuild`.
      #
      # Autobuild for a Gradle project runs `./gradlew assemble`, which includes
      # `assembleRelease` — and configuring :app:packageRelease fails without the release signing
      # secrets, which a pull request from a fork never has. The analysis then dies on a build
      # error rather than reporting anything.
      #
      # Only the debug variant is needed: it compiles exactly the same source that CodeQL
      # analyses, and it needs no secrets.
      - name: Build (debug only)
        run: ./gradlew assembleDebug --stacktrace

      # Code scanning upload is only available on private repositories with GitHub Code Security.
      # Internal builds still run the full CodeQL analysis, but cannot publish SARIF results to
      # the Security tab. On a public repository the same workflow uploads normally.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:kotlin'
          upload: "${{ github.event.repository.private && 'never' || 'always' }}"