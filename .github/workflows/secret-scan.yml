name: Secret scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        with:
          # Full history. A secret removed in the latest commit is still in the object store, and
          # still a leak, so scanning only the tip would miss exactly the case worth catching.
          fetch-depth: 0

      - name: Scan for committed secrets
        run: ./scripts/scan-secrets.sh