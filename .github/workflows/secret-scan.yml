name: Secret scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        with:
          # Full history. A secret removed in the latest commit is still in the object store, and
          # still a leak, so scanning only the tip would miss exactly the case worth catching.
          fetch-depth: 0

      - name: Fail if a secret was committed
        run: ./gradlew --version > /dev/null || true
        shell: bash

      - name: Scan the history for credential-shaped strings
        run: |
          set -uo pipefail

          # Deliberately not a hosted scanning action. Those either need a licence key on an
          # organisation repository or upload a report off-platform, and this repository has one
          # secret-shaped risk worth checking: a Gemini API key, entered at runtime.
          PATTERNS='AIza[0-9A-Za-z_-]{35}|gh[pousr]_[0-9A-Za-z]{36,255}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[0-9A-Za-z-]{10,}'

          # Files that legitimately contain a pattern because they document it.
          ALLOW_PATHS='^\.github/workflows/secret-scan\.yml$|^\.env\.example$|^\.gitignore$'

          FAILED=0
          git grep -nI -E "$PATTERNS" -- . > hits.txt 2>/dev/null || true

          while IFS= read -r hit; do
            [ -z "$hit" ] && continue
            file=$(printf '%s' "$hit" | cut -d: -f1)
            if printf '%s' "$file" | grep -Eq "$ALLOW_PATHS"; then
              continue
            fi
            printf '::error file=%s::Possible committed secret on this line.' "$file"
            FAILED=1
          done < hits.txt

          if [ "$FAILED" -ne 0 ]; then
            echo "A credential-shaped string is committed. Remove it and rotate the key."
            exit 1
          fi

          # Also refuse the files that must never be tracked at all, whatever they contain.
          for forbidden in .env local.properties; do
            if git ls-files --error-unmatch "$forbidden" >/dev/null 2>&1; then
              echo "::error::$forbidden is tracked and must never be committed."
              exit 1
            fi
          done

          if git ls-files --error-unmatch '*.jks' >/dev/null 2>&1; then
            echo '::error::a .jks keystore is tracked.'
            exit 1
          fi
          if git ls-files --error-unmatch '*.keystore' >/dev/null 2>&1; then
            echo '::error::a .keystore file is tracked.'
            exit 1
          fi

          echo "No secrets found."
