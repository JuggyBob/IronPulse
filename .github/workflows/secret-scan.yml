name: Secret scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Scan for committed secrets
        # The script scans the working tree and then walks whatever history is available, so it
        # reports what it can see either way.
        run: ./scripts/scan-secrets.sh